name: Auto Post to SNS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-sns.yml']
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'POST_SLOT (0=朝 1=昼 2=夜)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          echo "BSKY_HANDLE set: $([ -n "$BSKY_HANDLE" ] && echo YES || echo NO)"
          echo "BSKY_APP_PASSWORD set: $([ -n "$BSKY_APP_PASSWORD" ] && echo YES || echo NO)"
          echo "Node: $(node --version)"

      - name: Determine slot
        id: slot
        run: |
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "00" ]; then echo "slot=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then echo "slot=1" >> $GITHUB_OUTPUT
          else                          echo "slot=2" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Post to SNS
        continue-on-error: true
        env:
          POST_SLOT:         ${{ steps.slot.outputs.slot }}
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MISSKEY_INSTANCE:  ${{ secrets.MISSKEY_INSTANCE }}
          MISSKEY_TOKEN:     ${{ secrets.MISSKEY_TOKEN }}
        run: |
          node scripts/post_sns.js > /tmp/sns_log.txt 2>&1
          echo "EXIT_CODE:$?" >> /tmp/sns_log.txt

      - name: Save log via GitHub API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(cat /tmp/sns_log.txt 2>/dev/null || echo 'NO LOG FILE')
          ENCODED=$(printf '%s' "$LOG" | base64 | tr -d '\n')
          EXISTING_SHA=$(curl -sf \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/logs/last-run.txt" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo '')
          if [ -n "$EXISTING_SHA" ]; then
            BODY=$(python3 -c "import json; print(json.dumps({'message':'log: SNS run','content':'$ENCODED','sha':'$EXISTING_SHA'}))")
          else
            BODY=$(python3 -c "import json; print(json.dumps({'message':'log: SNS run','content':'$ENCODED'}))")
          fi
          HTTP=$(curl -s -o /tmp/api_resp.txt -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/logs/last-run.txt")
          echo "GitHub API status: $HTTP"
