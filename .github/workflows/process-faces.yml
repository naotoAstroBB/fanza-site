name: Process Actress Faces

on:
  push:
    branches: [main]
    paths:
      - 'scripts/process_actress_faces.py'
      - '.github/workflows/process-faces.yml'
  schedule:
    - cron: '0 17 * * *'  # JST 2:00 AM 毎日
  workflow_dispatch:

concurrency:
  group: process-faces
  cancel-in-progress: false

jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Process actress face images
        run: |
          pip install opencv-python-headless pillow -q
          python3 scripts/process_actress_faces.py

      - name: Commit face images
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/faces/
          git diff --staged --quiet || git commit -m "chore: update actress face images $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
