name: Auto Post to SNS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-sns.yml']
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'POST_SLOT (0=朝 1=昼 2=夜)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "00" ]; then echo "slot=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then echo "slot=1" >> $GITHUB_OUTPUT
          else                          echo "slot=2" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Post to SNS
        continue-on-error: true
        env:
          POST_SLOT:         ${{ steps.slot.outputs.slot }}
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MISSKEY_INSTANCE:  ${{ secrets.MISSKEY_INSTANCE }}
          MISSKEY_TOKEN:     ${{ secrets.MISSKEY_TOKEN }}
        run: |
          node scripts/post_sns.js 2>&1 | tee /tmp/sns_log.txt || true

      - name: Report result (always)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no log)';
            try { log = fs.readFileSync('/tmp/sns_log.txt', 'utf8'); } catch(e) { log = 'log read error: ' + e.message; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DEBUG] SNS run ' + new Date().toISOString(),
              body: '```\n' + log.slice(0, 6000) + '\n```'
            });
