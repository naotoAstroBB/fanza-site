name: Fetch FANZA Products

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate PWA icons (初回のみ)
        run: python3 scripts/gen_icons.py

      - name: Fetch products
        run: |
          # 前回のランキングを保存（順位変動バッジ用）
          cp data/rank.json data/rank_prev.json 2>/dev/null || true

          BASE="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=digital&output=json&hits=100"

          # ソート別
          curl -sf "$BASE&floor=videoa&sort=rank"   -o data/rank.json      || echo '{"result":{"status":404}}' > data/rank.json
          curl -sf "$BASE&floor=videoa&sort=date"   -o data/new.json       || echo '{"result":{"status":404}}' > data/new.json
          curl -sf "$BASE&floor=videoa&sort=review" -o data/review.json    || echo '{"result":{"status":404}}' > data/review.json
          curl -sf "$BASE&floor=videoa&sort=price"  -o data/price_asc.json || echo '{"result":{"status":404}}' > data/price_asc.json
          curl -sf "$BASE&floor=videoa&sort=-price" -o data/price_desc.json || echo '{"result":{"status":404}}' > data/price_desc.json

          # フロア別
          curl -sf "$BASE&floor=anime&sort=rank"    -o data/anime.json  || echo '{"result":{"status":404}}' > data/anime.json
          # マンガ/電子書籍（service=ebook&floor=comic が正解）
          MANGA_BASE="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=ebook&floor=comic&output=json&hits=100"
          curl -sf "${MANGA_BASE}&sort=rank" -o data/manga.json || echo '{"result":{"status":200,"items":[],"total_count":0,"result_count":0}}' > data/manga.json
          curl -sf "https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=mono&floor=goods&output=json&hits=100&sort=rank" \
            -o data/goods.json || echo '{"result":{"status":404}}' > data/goods.json

          # ジャンル別 - 全ソート種別対応（rank/date/review/price/pricelow）
          for row in \
            "2001:genre_busty" \
            "1027:genre_bishoujo" \
            "6533:genre_hd" \
            "4025:genre_single" \
            "4024:genre_amateur" \
            "5001:genre_creampie" \
            "1039:genre_wife" \
            "1001:genre_ol" \
            "4031:genre_cosplay" \
            "6006:genre_debut" \
            "1034:genre_gal" \
            "4022:genre_foreign" \
            "4001:genre_sm"; do
            ID="${row%%:*}"; NAME="${row##*:}"
            EMPTY='{"result":{"status":404}}'
            # rank（デフォルト・後方互換）
            curl -sf "$BASE&floor=videoa&sort=rank&article=genre&article_id=$ID"   -o "data/${NAME}.json"          || echo "$EMPTY" > "data/${NAME}.json"
            # 新着順
            curl -sf "$BASE&floor=videoa&sort=date&article=genre&article_id=$ID"   -o "data/${NAME}_date.json"     || echo "$EMPTY" > "data/${NAME}_date.json"
            # レビュー順
            curl -sf "$BASE&floor=videoa&sort=review&article=genre&article_id=$ID" -o "data/${NAME}_review.json"   || echo "$EMPTY" > "data/${NAME}_review.json"
            # 価格高い順（sort=price = 高い順）
            curl -sf "$BASE&floor=videoa&sort=price&article=genre&article_id=$ID"  -o "data/${NAME}_price.json"    || echo "$EMPTY" > "data/${NAME}_price.json"
            # 価格安い順（sort=-price = 安い順）
            curl -sf "$BASE&floor=videoa&sort=-price&article=genre&article_id=$ID" -o "data/${NAME}_pricelow.json" || echo "$EMPTY" > "data/${NAME}_pricelow.json"
          done

      - name: Fetch actress data
        run: |
          API="https://api.dmm.com/affiliate/v3/ActressSearch?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&hits=1&output=json"

          build_actress_json() {
            local IDS="$1"
            local OUT="$2"
            local JSON="["
            local first=true
            for ID in $IDS; do
              [ "$ID" = "null" ] || [ -z "$ID" ] && continue
              DATA=$(curl -s "${API}&actress_id=${ID}" || echo '{}')
              ACTRESS=$(echo "$DATA" | jq '.result.actress[0] // empty' 2>/dev/null)
              if [ -n "$ACTRESS" ] && [ "$ACTRESS" != "null" ]; then
                [ "$first" = true ] && first=false || JSON="${JSON},"
                JSON="${JSON}${ACTRESS}"
              fi
              sleep 0.15
            done
            JSON="${JSON}]"
            echo "{\"result\":{\"status\":200,\"actress\":${JSON}}}" > "$OUT"
          }

          # 人気女優：rank.jsonの商品から女優IDを抽出（先頭女優を優先、重複除去）
          POPULAR_IDS=$(jq -r '.result.items[] | .iteminfo.actress[0]?.id | tostring' data/rank.json 2>/dev/null \
            | awk '!seen[$0]++ && $0 != "null"' | head -15)
          build_actress_json "$POPULAR_IDS" data/actress_popular.json \
            || echo '{"result":{"status":404}}' > data/actress_popular.json

          # 新着女優：new.jsonの商品から女優IDを抽出
          NEW_IDS=$(jq -r '.result.items[] | .iteminfo.actress[0]?.id | tostring' data/new.json 2>/dev/null \
            | awk '!seen[$0]++ && $0 != "null"' | head -15)
          build_actress_json "$NEW_IDS" data/actress_new.json \
            || echo '{"result":{"status":404}}' > data/actress_new.json

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ icons/
          git diff --staged --quiet || git commit -m "chore: update product data $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
