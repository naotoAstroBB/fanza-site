<script src="js/storage.js"></script>
<script src="js/dmm-api.js"></script>
<script>
if (localStorage.getItem('age_verified') !== 'yes') location.href = 'index.html';

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function appBack() {
    if (document.referrer && new URL(document.referrer).origin === location.origin) {
        history.back();
    } else {
        location.href = 'home.html';
    }
}

const TAB_DESC = {
    popular: '今週の人気出演女優ベスト50',
    monthly: '今月最も注目される女優ベスト50',
    new:     '新人・デビュー女優（最新登録順）',
};

const calcAge = (bday) => {
    if (!bday) return null;
    const d = new Date(bday);
    const today = new Date();
    let age = today.getFullYear() - d.getFullYear();
    const m = today.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < d.getDate())) age--;
    return (age > 0 && age < 70) ? age : null;
};

const specs = (a) => {
    const age   = calcAge(a.birthday);
    const bust  = a.bust  ? `B${a.bust}` + (a.cup ? `(${a.cup})` : '') : '';
    const waist = a.waist ? `W${a.waist}` : '';
    const hip   = a.hip   ? `H${a.hip}`   : '';
    const height = a.height ? `${a.height}cm` : '';
    const blood  = a.blood_type && a.blood_type !== '他' ? `${a.blood_type}型` : '';
    return {
        meta: [age ? age + '歳' : '', blood, height].filter(Boolean).join(' · '),
        measure: [bust, waist, hip].filter(Boolean).join(' '),
    };
};

async function renderActresses(type) {
    const el = document.getElementById('actressFullList');
    el.className = '';
    el.innerHTML = '<div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>';
    document.getElementById('actressTabDesc').textContent = TAB_DESC[type] || '';
    try {
        const data = await DMM.fetchActress(type);
        const actresses = (data?.result?.actress || []).slice(0, 50);
        if (!actresses.length) {
            el.innerHTML = '<p style="color:var(--mute);text-align:center;padding:60px 0">データ準備中</p>';
            return;
        }
        const showRank = type !== 'new';

        const renderPodium = (a, idx) => {
            const img = a.imageURL?.large || a.imageURL?.small || '';
            const name = esc(a.name || '');
            const href = `actress.html?id=${esc(String(a.id))}&name=${encodeURIComponent(a.name || '')}`;
            const initial = (a.name || '').charAt(0) || '♀';
            const sp = specs(a);
            const medals = ['🥇','🥈','🥉'];
            return `
            <a class="actress-podium-card actress-rank-${idx + 1}" href="${href}">
                <div class="actress-podium-medal">${medals[idx]}</div>
                <div class="actress-podium-rank-num">${idx + 1}</div>
                <div class="actress-podium-photo">
                    ${img ? `<img src="${esc(img)}" alt="${name}" loading="lazy">` : `<div class="actress-no-img-podium">${initial}</div>`}
                </div>
                <div class="actress-podium-name">${name}</div>
                ${sp.meta    ? `<div class="actress-podium-meta">${sp.meta}</div>` : ''}
                ${sp.measure ? `<div class="actress-podium-measure">${sp.measure}</div>` : ''}
            </a>`;
        };

        const renderListCard = (a, idx) => {
            const img = a.imageURL?.small || '';
            const name = esc(a.name || '');
            const href = `actress.html?id=${esc(String(a.id))}&name=${encodeURIComponent(a.name || '')}`;
            const initial = (a.name || '').charAt(0) || '♀';
            const sp = specs(a);
            const rankLabel = showRank ? `${idx + 1}` : '★';
            return `
            <a class="actress-list-card" href="${href}">
                <div class="actress-list-rank">${rankLabel}</div>
                <div class="actress-list-photo-wrap">
                    ${img ? `<img class="actress-list-photo" src="${esc(img)}" alt="${name}" loading="lazy">` : `<div class="actress-list-photo actress-no-img-list">${initial}</div>`}
                </div>
                <div class="actress-list-info">
                    <div class="actress-list-name">${name}</div>
                    ${sp.meta    ? `<div class="actress-list-meta">${sp.meta}</div>` : ''}
                    ${sp.measure ? `<div class="actress-list-measure">${sp.measure}</div>` : ''}
                </div>
            </a>`;
        };

        const top3 = showRank ? actresses.slice(0, 3) : [];
        const rest = showRank ? actresses.slice(3) : actresses;

        el.className = 'actress-podium-wrap';
        el.innerHTML = `
            ${top3.length ? `<div class="actress-podium">${top3.map((a, i) => renderPodium(a, i)).join('')}</div>` : ''}
            ${rest.length ? `<div class="actress-list-grid">${rest.map((a, i) => renderListCard(a, showRank ? i + 3 : i)).join('')}</div>` : ''}
        `;
        window.scrollTo({top:0, behavior:'instant'});
    } catch(e) {
        el.innerHTML = '<p style="color:var(--mute);text-align:center;padding:60px 0">データ取得に失敗しました</p>';
    }
}

function switchTab(type, btn) {
    document.querySelectorAll('.actress-tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderActresses(type);
    history.replaceState(null, '', `?tab=${type}`);
}

// 初期表示：URLパラメータ?tab=... 優先
const urlTab = new URLSearchParams(location.search).get('tab') || 'popular';
const validTabs = ['popular', 'monthly', 'new'];
const initialTab = validTabs.includes(urlTab) ? urlTab : 'popular';
document.querySelectorAll('.actress-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === initialTab);
});
renderActresses(initialTab);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
