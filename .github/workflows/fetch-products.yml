name: Fetch FANZA Products

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch products
        run: |
          BASE="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=digital&output=json&hits=24"

          # ソート別
          curl -sf "$BASE&floor=videoa&sort=rank"   -o data/rank.json   || echo '{"result":{"status":404}}' > data/rank.json
          curl -sf "$BASE&floor=videoa&sort=date"   -o data/new.json    || echo '{"result":{"status":404}}' > data/new.json
          curl -sf "$BASE&floor=videoa&sort=review" -o data/review.json || echo '{"result":{"status":404}}' > data/review.json

          # フロア別
          curl -sf "$BASE&floor=anime&sort=rank"    -o data/anime.json  || echo '{"result":{"status":404}}' > data/anime.json
          curl -sf "https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=mono&floor=goods&output=json&hits=24&sort=rank" \
            -o data/goods.json || echo '{"result":{"status":404}}' > data/goods.json

          # ジャンル別 (全ジャンル対応)
          for row in \
            "4002:genre_busty" \
            "4007:genre_bishoujo" \
            "4049:genre_hd" \
            "4013:genre_single" \
            "4017:genre_amateur" \
            "4028:genre_creampie" \
            "4065:genre_wife" \
            "4051:genre_ol" \
            "4061:genre_cosplay"; do
            ID="${row%%:*}"; FILE="data/${row##*:}.json"
            curl -sf "$BASE&floor=videoa&sort=rank&article=genre&article_id=$ID" -o "$FILE" \
              || echo '{"result":{"status":404}}' > "$FILE"
          done

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update product data $(date +'%Y-%m-%d %H:%M')"
          git push
