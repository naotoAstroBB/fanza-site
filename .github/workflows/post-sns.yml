name: Auto Post to SNS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-sns.yml']
  schedule:
    # JST 9:00 / 15:00 / 21:00 (UTC 0:00 / 6:00 / 12:00)
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'POST_SLOT (0=朝 1=昼 2=夜)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "00" ]; then echo "slot=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then echo "slot=1" >> $GITHUB_OUTPUT
          else                          echo "slot=2" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Post to SNS
        id: post
        env:
          POST_SLOT:         ${{ steps.slot.outputs.slot }}
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MISSKEY_INSTANCE:  ${{ secrets.MISSKEY_INSTANCE }}
          MISSKEY_TOKEN:     ${{ secrets.MISSKEY_TOKEN }}
        run: |
          node scripts/post_sns.js 2>&1 | tee /tmp/sns_log.txt
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Save log to repo
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/sns_log.txt logs/last-run.txt || echo '(no output)' > logs/last-run.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add logs/last-run.txt
          git diff --staged --quiet || git commit -m "log: SNS post $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
