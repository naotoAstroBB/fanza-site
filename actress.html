<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女優ページ | AV動画ランキング</title>
<link rel="stylesheet" href="css/style.css">
<style>
.actress-hero {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 32px 20px;
}
.actress-hero-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; gap: 28px; align-items: flex-start;
}
.actress-hero-photo {
    width: 120px; height: 120px; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--accent); flex-shrink: 0;
}
.actress-hero-no-img {
    width: 120px; height: 120px; border-radius: 50%;
    background: #222; display: flex; align-items: center;
    justify-content: center; font-size: 3.5rem;
    border: 3px solid var(--accent); flex-shrink: 0;
}
.actress-hero-info { flex: 1; min-width: 0; }
.actress-hero-name {
    font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 4px;
}
.actress-hero-ruby { font-size: .85rem; color: var(--mute); margin-bottom: 12px; }
.actress-hero-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.actress-meta-tag {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 12px;
    font-size: .8rem; color: #bbb;
}
.actress-fanza-btn {
    display: inline-block; padding: 10px 22px;
    background: linear-gradient(135deg, #ff3366, #cc0033);
    color: #fff; font-weight: 700; font-size: .9rem;
    border-radius: 8px; transition: opacity .2s;
}
.actress-fanza-btn:hover { opacity: .85; color: #fff; }
.actress-works-section {
    max-width: 1280px; margin: 0 auto; padding: 32px 20px;
}
.actress-works-title {
    font-size: 1.1rem; font-weight: 700; color: #fff;
    margin-bottom: 20px; padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
    display: flex; align-items: center; gap: 8px;
}
.actress-works-count { font-size: .82rem; color: var(--mute); font-weight: 400; }
@media(max-width:600px){
    .actress-hero-inner { flex-direction: column; align-items: center; text-align: center; }
    .actress-hero-meta { justify-content: center; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="site-logo"><a href="home.html" style="color:inherit;text-decoration:none">AV動画ランキング</a></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="検索..." autocomplete="off">
      <button onclick="doSearch()">🔍</button>
    </div>
  </div>
</header>

<!-- パンくず -->
<div style="background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 20px;font-size:.82rem;color:var(--mute)">
  <a href="home.html" style="color:var(--mute)">TOP</a> › <span id="breadName">女優ページ</span>
</div>

<!-- 女優プロフィール -->
<div class="actress-hero" id="actressHero">
  <div class="actress-hero-inner">
    <div class="actress-hero-no-img">👩</div>
    <div class="actress-hero-info">
      <div class="actress-hero-name" id="actressName">読み込み中...</div>
      <div class="actress-hero-ruby" id="actressRuby"></div>
      <div class="actress-hero-meta" id="actressMeta"></div>
      <a class="actress-fanza-btn" id="actressLink" href="#" target="_blank" rel="noopener">🎬 全作品を見る</a>
    </div>
  </div>
</div>

<!-- 作品一覧 -->
<div class="actress-works-section">
  <div class="actress-works-title">
    🎬 出演作品
    <span class="actress-works-count" id="worksCount"></span>
  </div>
  <div class="product-grid" id="worksGrid">
    <div class="loading"><div class="spinner"></div><p>作品を検索中...</p></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<footer class="site-footer">
  <div class="footer-nav">
    <a href="home.html">TOP</a>
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="disclaimer.html">免責事項</a>
  </div>
  <p>当サイトはFANZA（DMM.com）のアフィリエイトプログラムを利用しています。</p>
  <div class="footer-copy">© 2026 AV動画ランキング All Rights Reserved.</div>
</footer>

<script src="js/storage.js"></script>
<script src="js/dmm-api.js"></script>
<script>
if (localStorage.getItem('age_verified') !== 'yes') location.href = 'index.html';

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const p          = new URLSearchParams(location.search);
const actressId  = p.get('id')   || '';
const actressName= p.get('name') || '';
const floor      = p.get('floor')|| 'videoa';

let allWorks = [], page = 1;
const PER_PAGE = 24;

function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) location.href = 'home.html?keyword=' + encodeURIComponent(q);
}
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ===== 女優情報を表示 =====
async function loadActressInfo() {
    if (!actressId) { showError('女優IDが指定されていません'); return; }

    document.title = (actressName || '女優') + '出演作品 | AV動画ランキング';
    document.getElementById('breadName').textContent = actressName || '女優ページ';

    // actress_popular / actress_new からプロフィール情報を探す
    let actress = null;
    for (const type of ['popular', 'new']) {
        try {
            const data = await DMM.fetchActress(type);
            const found = (data?.result?.actress || []).find(a => String(a.id) === String(actressId));
            if (found) { actress = found; break; }
        } catch(e) {}
    }

    const hero = document.getElementById('actressHero');
    const img  = actress?.imageURL?.large || actress?.imageURL?.small || '';
    const name = actress?.name || actressName || '女優';
    const ruby = actress?.ruby || '';
    const link = actress?.listURL?.digital || `https://www.dmm.co.jp/digital/videoa/-/actress/=/id=${actressId}/`;

    // プロフィール表示
    hero.querySelector('.actress-hero-inner').innerHTML = `
        ${img
            ? `<img class="actress-hero-photo" src="${esc(img)}" alt="${esc(name)}">`
            : `<div class="actress-hero-no-img">👩</div>`
        }
        <div class="actress-hero-info">
            <div class="actress-hero-name">${esc(name)}</div>
            ${ruby ? `<div class="actress-hero-ruby">${esc(ruby)}</div>` : ''}
            <div class="actress-hero-meta" id="actressMeta"></div>
            <a class="actress-fanza-btn" href="${esc(link)}" target="_blank" rel="noopener">🎬 全作品を見る</a>
        </div>`;

    document.title = name + ' 出演作品 | AV動画ランキング';
    document.getElementById('breadName').textContent = name;

    // 作品を検索
    await loadWorks();
}

// ===== 出演作品を収集（女優別JSON優先 → 横断検索で補完）=====
async function loadWorks() {
    const seen = new Set();
    let works = [];

    // ① 女優別専用JSONを試みる（最大100件、最新作中心）
    try {
        const ts = Math.floor(Date.now() / 60000);
        const res = await fetch(`data/actress_works_${actressId}.json?_=${ts}`);
        if (res.ok) {
            const data = await res.json();
            if (data?.result?.status === 200 && data.result.items?.length) {
                for (const item of data.result.items) {
                    if (!seen.has(item.content_id)) {
                        seen.add(item.content_id);
                        works.push(item);
                    }
                }
            }
        }
    } catch(e) {}

    // ② 全JSONを横断検索して追加作品を補完
    const allFiles = [
        ...Object.values(DMM.sortFiles),
        ...Object.values(DMM.floorFiles),
        ...Object.values(DMM.genreFiles),
    ];
    const results = await Promise.allSettled(allFiles.map(f => DMM._loadFile(f).catch(() => null)));
    for (const r of results) {
        if (r.status !== 'fulfilled' || !r.value) continue;
        for (const item of (r.value?.result?.items || [])) {
            if (seen.has(item.content_id)) continue;
            const ids = (item.iteminfo?.actress || []).map(a => String(a.id));
            if (ids.includes(String(actressId))) {
                seen.add(item.content_id);
                works.push(item);
            }
        }
    }

    // 新着順にソート
    works.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    allWorks = works;
    const countEl = document.getElementById('worksCount');
    if (countEl) countEl.textContent = `（${works.length}件）`;

    renderWorks(page);
    renderPagination();
}

// ===== 作品グリッド描画 =====
function renderWorks(pg) {
    const grid  = document.getElementById('worksGrid');
    const start = (pg - 1) * PER_PAGE;
    const items = allWorks.slice(start, start + PER_PAGE);

    if (!items.length) {
        grid.innerHTML = '<div class="loading"><p>出演作品が見つかりませんでした</p><p style="font-size:.8rem;color:var(--mute);margin-top:8px">※ サイト内キャッシュにない作品は各サービスで直接ご確認ください</p></div>';
        return;
    }

    grid.innerHTML = items.map(item => {
        const img    = esc(item.imageURL?.list || item.imageURL?.small || '');
        const title  = esc(item.title || '');
        const price  = item.prices?.price || '';
        const url    = esc(item.affiliateURL || item.URL || '#');
        const cid    = esc(item.content_id);
        const isFav  = Fav.has(item.content_id);
        const review = item.review;
        const avg    = parseFloat(review?.average || 0);
        const stars  = avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg)) : '';
        return `
        <div class="product-card" onclick="location.href='product.html?cid=${cid}&floor=${esc(floor)}'">
          <div class="card-img-wrap">
            ${img ? `<img src="${img}" alt="${title}" loading="lazy">` : '<div style="height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#333;font-size:2rem">🎬</div>'}
            <button class="fav-btn ${isFav?'active':''}"
              onclick="event.stopPropagation();toggleFav(this,'${cid}',event)">${isFav?'❤️':'🤍'}</button>
          </div>
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-bottom">
              ${price ? `<div class="card-price">¥${esc(price)}</div>` : '<div></div>'}
              ${stars ? `<div class="card-review"><span class="stars">${stars}</span></div>` : ''}
            </div>
            <a class="btn-buy" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">動画を見る →</a>
          </div>
        </div>`;
    }).join('');
}

function toggleFav(btn, cid) {
    const item = allWorks.find(i => i.content_id === cid);
    if (!item) return;
    const isNow = Fav.toggle(item, floor);
    btn.classList.toggle('active', isNow);
    btn.textContent = isNow ? '❤️' : '🤍';
}

function renderPagination() {
    const el    = document.getElementById('pagination');
    const total = Math.ceil(allWorks.length / PER_PAGE);
    if (!el || total <= 1) { if (el) el.innerHTML = ''; return; }

    let html = `<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">‹ 前へ</button>`;
    for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" ${page===total?'disabled':''} onclick="goPage(${page+1})">次へ ›</button>`;
    el.innerHTML = html;
}

function goPage(n) {
    page = n;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderWorks(page);
    renderPagination();
}

function showError(msg) {
    document.getElementById('worksGrid').innerHTML = `<div class="loading"><p style="color:#ff6688">⚠️ ${esc(msg)}</p></div>`;
}

loadActressInfo();
</script>
</body>
</html>
