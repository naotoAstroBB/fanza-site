name: Post to X (Twitter)

on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 JST  ランキング投稿
    - cron: '0 3 * * *'    # 12:00 JST  人気女優投稿
    - cron: '0 12 * * *'   # 21:00 JST  新着・セール投稿
  workflow_dispatch:
    inputs:
      tweet_type:
        description: 'rank（ランキング） / actress（女優） / new（新着）/ 空欄=自動'
        required: false
        default: ''
      dry_run:
        description: 'true にすると投稿せずプレビューのみ'
        required: false
        default: 'false'

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tweepy
        run: pip install tweepy --quiet

      - name: Post tweet
        env:
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWEET_TYPE:                  ${{ inputs.tweet_type }}
          DRY_RUN:                     ${{ inputs.dry_run }}
        run: python scripts/tweet.py
