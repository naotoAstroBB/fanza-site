name: Fetch FANZA Products

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate PWA icons (初回のみ)
        run: python3 scripts/gen_icons.py

      - name: Fetch products
        run: |
          # 前回のランキングを保存（順位変動バッジ用）
          cp data/rank.json data/rank_prev.json 2>/dev/null || true

          BASE_URL="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=digital&output=json"
          BASE="$BASE_URL&hits=100"

          # 2ページ取得してmerge（最大200件）
          merge_fetch() {
            local OUT="$1" QUERY="$2"
            curl -sf "${QUERY}&hits=100"            -o /tmp/p1.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p1.json
            curl -sf "${QUERY}&hits=100&offset=101" -o /tmp/p2.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p2.json
            jq -s '((.[0].result.items//[])+(.[1].result.items//[])) as $it |
              {result:{status:200,items:$it,total_count:($it|length),result_count:($it|length)}}
            ' /tmp/p1.json /tmp/p2.json > "$OUT" || echo '{"result":{"status":404}}' > "$OUT"
          }

          # 3ページ取得してmerge（最大300件）
          merge_fetch3() {
            local OUT="$1" QUERY="$2"
            curl -sf "${QUERY}&hits=100"            -o /tmp/p1.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p1.json
            curl -sf "${QUERY}&hits=100&offset=101" -o /tmp/p2.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p2.json
            curl -sf "${QUERY}&hits=100&offset=201" -o /tmp/p3.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p3.json
            jq -s '((.[0].result.items//[])+(.[1].result.items//[])+(.[2].result.items//[])) as $it |
              {result:{status:200,items:$it,total_count:($it|length),result_count:($it|length)}}
            ' /tmp/p1.json /tmp/p2.json /tmp/p3.json > "$OUT" || echo '{"result":{"status":404}}' > "$OUT"
          }

          # 5ページ取得してmerge（最大500件）
          merge_fetch5() {
            local OUT="$1" QUERY="$2"
            curl -sf "${QUERY}&hits=100"            -o /tmp/p1.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p1.json
            curl -sf "${QUERY}&hits=100&offset=101" -o /tmp/p2.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p2.json
            curl -sf "${QUERY}&hits=100&offset=201" -o /tmp/p3.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p3.json
            curl -sf "${QUERY}&hits=100&offset=301" -o /tmp/p4.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p4.json
            curl -sf "${QUERY}&hits=100&offset=401" -o /tmp/p5.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/p5.json
            jq -s '((.[0].result.items//[])+(.[1].result.items//[])+(.[2].result.items//[])+(.[3].result.items//[])+(.[4].result.items//[])) as $it |
              {result:{status:200,items:$it,total_count:($it|length),result_count:($it|length)}}
            ' /tmp/p1.json /tmp/p2.json /tmp/p3.json /tmp/p4.json /tmp/p5.json > "$OUT" || echo '{"result":{"status":404}}' > "$OUT"
          }

          # 汎用：任意ページ数取得してmerge（offset制限内なら数千件まで対応可）
          merge_fetch_n() {
            local PAGES=$1; local OUT=$2; local QUERY=$3
            rm -f /tmp/mfn_*.json
            for i in $(seq 1 $PAGES); do
              local off_param=""
              [ $i -gt 1 ] && off_param="&offset=$(( (i-1)*100 + 1 ))"
              curl -sf "${QUERY}&hits=100${off_param}" -o /tmp/mfn_${i}.json 2>/dev/null \
                || echo '{"result":{"items":[]}}' > /tmp/mfn_${i}.json
            done
            local files=""
            for i in $(seq 1 $PAGES); do files="$files /tmp/mfn_${i}.json"; done
            jq -s '
              [.[].result.items // []] | add as $items |
              {result:{status:200, items:($items // []), total_count:($items // [] | length), result_count:($items // [] | length)}}
            ' $files > "$OUT" 2>/dev/null || echo '{"result":{"status":404}}' > "$OUT"
          }

          # ========== 動画優先で数十万件規模に拡大 ==========
          # 動画系 rank/新作/高評価 = 各50ページ・最大5000件（=videoa全体15,000件）
          merge_fetch_n 50 data/rank.json   "$BASE_URL&floor=videoa&sort=rank"
          merge_fetch_n 50 data/new.json    "$BASE_URL&floor=videoa&sort=date"
          merge_fetch_n 50 data/review.json "$BASE_URL&floor=videoa&sort=review"

          # アニメ・マンガ・グッズ = 各10ページ・最大1000件 × 3ソート
          ANIME_BASE="$BASE_URL&floor=anime"
          merge_fetch_n 10 data/anime.json        "${ANIME_BASE}&sort=rank"
          merge_fetch_n 10 data/anime_date.json   "${ANIME_BASE}&sort=date"
          merge_fetch_n 10 data/anime_review.json "${ANIME_BASE}&sort=review"

          MANGA_BASE_URL="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=ebook&floor=comic&output=json"
          merge_fetch_n 10 data/manga.json        "${MANGA_BASE_URL}&sort=rank"
          merge_fetch_n 10 data/manga_date.json   "${MANGA_BASE_URL}&sort=date"
          merge_fetch_n 10 data/manga_review.json "${MANGA_BASE_URL}&sort=review"

          GOODS_BASE="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=mono&floor=goods&output=json"
          merge_fetch_n 10 data/goods.json        "${GOODS_BASE}&sort=rank"
          merge_fetch_n 10 data/goods_date.json   "${GOODS_BASE}&sort=date"
          merge_fetch_n 10 data/goods_review.json "${GOODS_BASE}&sort=review"

          # ジャンル別 - rank は5ページ（500件）、date/review は3ページ（300件）
          for row in \
            "2001:genre_busty" \
            "1027:genre_bishoujo" \
            "6533:genre_hd" \
            "4025:genre_single" \
            "4024:genre_amateur" \
            "5001:genre_creampie" \
            "1039:genre_wife" \
            "1001:genre_ol" \
            "4031:genre_cosplay" \
            "6006:genre_debut" \
            "1034:genre_gal" \
            "4022:genre_foreign" \
            "4001:genre_sm" \
            "4006:genre_nanpa" \
            "2005:genre_hinyu" \
            "1018:genre_jk" \
            "1016:genre_teacher" \
            "4002:genre_kinshin" \
            "1028:genre_kuro" \
            "4007:genre_kikaku" \
            "5002:genre_fella"; do
            ID="${row%%:*}"; NAME="${row##*:}"
            # 動画ジャンル別：人気=20ページ(2000件)、新作/高評価=15ページ(1500件) ← 動画優先で増量
            merge_fetch_n 20 "data/${NAME}.json"        "$BASE_URL&floor=videoa&sort=rank&article=genre&article_id=$ID"
            merge_fetch_n 15 "data/${NAME}_date.json"   "$BASE_URL&floor=videoa&sort=date&article=genre&article_id=$ID"
            merge_fetch_n 15 "data/${NAME}_review.json" "$BASE_URL&floor=videoa&sort=review&article=genre&article_id=$ID"
          done

      - name: Fetch actress data
        run: |
          API="https://api.dmm.com/affiliate/v3/ActressSearch?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&hits=1&output=json"

          build_actress_json() {
            local IDS="$1"
            local OUT="$2"
            local JSON="["
            local first=true
            for ID in $IDS; do
              [ "$ID" = "null" ] || [ -z "$ID" ] && continue
              DATA=$(curl -s "${API}&actress_id=${ID}" || echo '{}')
              ACTRESS=$(echo "$DATA" | jq '.result.actress[0] // empty' 2>/dev/null)
              if [ -n "$ACTRESS" ] && [ "$ACTRESS" != "null" ]; then
                [ "$first" = true ] && first=false || JSON="${JSON},"
                JSON="${JSON}${ACTRESS}"
              fi
              sleep 0.15
            done
            JSON="${JSON}]"
            echo "{\"result\":{\"status\":200,\"actress\":${JSON}}}" > "$OUT"
          }

          # 人気女優：rank.jsonの商品から女優IDを抽出（先頭女優を優先、重複除去）- 50人に拡大
          POPULAR_IDS=$(jq -r '.result.items[] | .iteminfo.actress[0]?.id | tostring' data/rank.json 2>/dev/null \
            | awk '!seen[$0]++ && $0 != "null"' | head -50)
          build_actress_json "$POPULAR_IDS" data/actress_popular.json \
            || echo '{"result":{"status":404}}' > data/actress_popular.json

          # 新人女優：ActressSearch APIで「ID降順」=新規登録順に取得（=デビュー直後の女優）
          # 写真ありで絞り込み。100件取って画像ある女優を上位50人選ぶ
          ACTRESS_SEARCH="https://api.dmm.com/affiliate/v3/ActressSearch?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&output=json"
          curl -sf "${ACTRESS_SEARCH}&sort=-id&hits=100" -o /tmp/actress_newest.json 2>/dev/null \
            || echo '{"result":{"status":404,"actress":[]}}' > /tmp/actress_newest.json
          # 画像ありかつIDがnullでない女優のみ抽出、最大50人
          jq '{result: {status: 200, actress: [.result.actress[]? | select(.id != null and .imageURL.small != null)] | .[:50]}}' \
            /tmp/actress_newest.json > data/actress_new.json 2>/dev/null \
            || echo '{"result":{"status":404,"actress":[]}}' > data/actress_new.json

          # 念のため：上記が空の場合はデビュージャンル(genre_id=6006)からフォールバック
          ACTRESS_COUNT=$(jq '.result.actress | length' data/actress_new.json 2>/dev/null || echo 0)
          if [ "$ACTRESS_COUNT" -lt 10 ]; then
            NEW_IDS=$(jq -r '.result.items[] | .iteminfo.actress[]?.id | tostring' \
              data/genre_debut_date.json data/genre_debut.json 2>/dev/null \
              | awk '!seen[$0]++ && $0 != "null"' | head -50)
            build_actress_json "$NEW_IDS" data/actress_new.json \
              || echo '{"result":{"status":404}}' > data/actress_new.json
          fi

          # 月間人気女優：review.jsonから女優IDを抽出（より意味のあるデータ）
          MONTHLY_IDS=$(jq -r '.result.items[] | .iteminfo.actress[0]?.id | tostring' data/review.json 2>/dev/null \
            | awk '!seen[$0]++ && $0 != "null"' | head -30)
          build_actress_json "$MONTHLY_IDS" data/actress_monthly.json \
            || echo '{"result":{"status":404}}' > data/actress_monthly.json

          # 女優別作品JSON（popular + new + monthly の女優ID分を個別取得・3ページ・最大300件）
          WORK_BASE="https://api.dmm.com/affiliate/v3/ItemList?api_id=UXJdpULBN1sPyNKKPPHU&affiliate_id=saaaaaaya-990&site=FANZA&service=digital&output=json&floor=videoa&sort=date&article=actress"
          ALL_ACTRESS_IDS=$(jq -r '.result.actress[].id | tostring' data/actress_popular.json data/actress_new.json data/actress_monthly.json 2>/dev/null \
            | awk '!seen[$0]++ && $0 != "null"' | head -150)
          for AID in $ALL_ACTRESS_IDS; do
            curl -sf "${WORK_BASE}&hits=100&article_id=${AID}"            -o /tmp/aw1.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/aw1.json
            curl -sf "${WORK_BASE}&hits=100&offset=101&article_id=${AID}" -o /tmp/aw2.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/aw2.json
            curl -sf "${WORK_BASE}&hits=100&offset=201&article_id=${AID}" -o /tmp/aw3.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/aw3.json
            curl -sf "${WORK_BASE}&hits=100&offset=301&article_id=${AID}" -o /tmp/aw4.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/aw4.json
            curl -sf "${WORK_BASE}&hits=100&offset=401&article_id=${AID}" -o /tmp/aw5.json 2>/dev/null || echo '{"result":{"items":[]}}' > /tmp/aw5.json
            jq -s '((.[0].result.items//[])+(.[1].result.items//[])+(.[2].result.items//[])+(.[3].result.items//[])+(.[4].result.items//[])) as $it |
              {result:{status:200,items:$it,total_count:($it|length),result_count:($it|length)}}
            ' /tmp/aw1.json /tmp/aw2.json /tmp/aw3.json /tmp/aw4.json /tmp/aw5.json > "data/actress_works_${AID}.json" \
              || echo '{"result":{"status":404}}' > "data/actress_works_${AID}.json"
            sleep 0.3
          done

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ icons/
          git diff --staged --quiet || git commit -m "chore: update product data $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
