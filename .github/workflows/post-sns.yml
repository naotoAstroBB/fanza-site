name: Auto Post to SNS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/post-sns.yml']
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'POST_SLOT (0=朝 1=昼 2=夜)'
        required: false
        default: '0'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "00" ]; then echo "slot=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then echo "slot=1" >> $GITHUB_OUTPUT
          else                          echo "slot=2" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          fi

      - name: Debug + Post
        continue-on-error: true
        env:
          POST_SLOT:         ${{ steps.slot.outputs.slot }}
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MISSKEY_INSTANCE:  ${{ secrets.MISSKEY_INSTANCE }}
          MISSKEY_TOKEN:     ${{ secrets.MISSKEY_TOKEN }}
        run: |
          node - > /tmp/sns_log.txt 2>&1 << 'JSEOF'
          const https = require('https');
          const fs = require('fs');

          const h = process.env.BSKY_HANDLE || '';
          const p = process.env.BSKY_APP_PASSWORD || '';
          console.log('[DEBUG] Handle len:', h.length, '| Pass len:', p.length);
          console.log('[DEBUG] Handle:', h);
          console.log('[DEBUG] Pass first4:', p.slice(0,4));

          // Bluesky auth test
          const body = JSON.stringify({identifier: h, password: p});
          const req = https.request({
            hostname: 'bsky.social',
            path: '/xrpc/com.atproto.server.createSession',
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body)}
          }, res => {
            let d = '';
            res.on('data', c => d += c);
            res.on('end', () => {
              console.log('[DEBUG] Auth status:', res.statusCode);
              console.log('[DEBUG] Auth response:', d);
              if (res.statusCode === 200) {
                console.log('[OK] Auth success - loading main script');
                require('./scripts/post_sns.js');
              } else {
                console.error('[FAIL] Auth failed, stopping.');
                process.exit(1);
              }
            });
          });
          req.on('error', e => { console.error('[ERROR]', e.message); process.exit(1); });
          req.write(body);
          req.end();
          JSEOF
          echo "node_exit:$?" >> /tmp/sns_log.txt

      - name: Save log via GitHub API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(cat /tmp/sns_log.txt 2>/dev/null || echo 'NO LOG FILE')
          ENCODED=$(printf '%s' "$LOG" | base64 | tr -d '\n')
          EXISTING_SHA=$(curl -sf \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/logs/last-run.txt" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo '')
          if [ -n "$EXISTING_SHA" ]; then
            BODY=$(python3 -c "import json; print(json.dumps({'message':'log: SNS run','content':'$ENCODED','sha':'$EXISTING_SHA'}))")
          else
            BODY=$(python3 -c "import json; print(json.dumps({'message':'log: SNS run','content':'$ENCODED'}))")
          fi
          curl -s -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/logs/last-run.txt" > /dev/null
          echo "Log saved."
