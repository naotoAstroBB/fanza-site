<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>X投稿ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#eee;font-family:-apple-system,sans-serif;padding:16px}
h1{font-size:1.1rem;color:#ff3366;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #333}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:180px;background:#1a1a1a;border:1px solid #333;color:#eee;padding:8px 12px;border-radius:8px;font-size:.9rem}
.toolbar button{background:#ff3366;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.toolbar button:hover{opacity:.85}
.sort-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sort-tab{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:5px 12px;border-radius:16px;font-size:.78rem;cursor:pointer}
.sort-tab.active{background:#ff3366;border-color:#ff3366;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#ff3366}
.card.has-video{border-color:#555}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111}
.card-body{padding:8px}
.card-title{font-size:.75rem;color:#ddd;line-height:1.4;height:2.8em;overflow:hidden;margin-bottom:6px}
.card-actions{display:flex;gap:4px;flex-wrap:wrap}
.btn-small{font-size:.7rem;padding:4px 8px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.btn-vid{background:#e63950;color:#fff}
.btn-vid:hover{opacity:.85}
.btn-site{background:#2a4a7a;color:#fff}
.btn-site:hover{opacity:.85}
.btn-copy{background:#2a5a2a;color:#fff}
.btn-copy:hover{opacity:.85}
.badge-video{display:inline-block;background:#e63950;color:#fff;font-size:.6rem;padding:1px 5px;border-radius:3px;margin-bottom:4px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;padding:16px;overflow-y:auto}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.modal-inner{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;width:100%;max-width:540px;margin-top:20px}
.modal-inner h2{font-size:1rem;margin-bottom:12px;color:#ff8aaa}
.modal-inner video{width:100%;border-radius:8px;margin-bottom:12px}
.modal-url{background:#0f0f0f;border:1px solid #333;border-radius:8px;padding:10px;font-size:.78rem;color:#aaa;word-break:break-all;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-dl{background:#e63950;color:#fff}
.btn-cl{background:#2a5a2a;color:#fff}
.btn-tw{background:#1da1f2;color:#fff}
.btn-close{background:#333;color:#eee}
.btn-cl:hover,.btn-dl:hover,.btn-tw:hover{opacity:.85}
.loading{text-align:center;padding:40px;color:#555}
.spinner{width:32px;height:32px;border:3px solid #333;border-top-color:#ff3366;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#eee;padding:10px 20px;border-radius:20px;font-size:.85rem;z-index:200;display:none}
.toast.show{display:block}
.stats{font-size:.78rem;color:#666;margin-bottom:12px}
.stats span{color:#ff8aaa;font-weight:700}
</style>
</head>
<body>

<h1>🎬 X投稿ツール</h1>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="タイトル・女優名で絞り込み..." oninput="filterCards()">
  <button onclick="filterByVideo()">🎥 動画あり</button>
  <button onclick="clearFilter()">全表示</button>
</div>

<div class="sort-tabs" id="sortTabs">
  <span class="sort-tab active" onclick="loadSort('rank')">人気順</span>
  <span class="sort-tab" onclick="loadSort('new')">新着順</span>
  <span class="sort-tab" onclick="loadSort('review')">高評価</span>
</div>

<div class="stats" id="stats"></div>
<div class="grid" id="grid"><div class="loading"><div class="spinner"></div><p>読み込み中...</p></div></div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-inner" onclick="event.stopPropagation()">
    <h2 id="modalTitle"></h2>
    <video id="modalVideo" controls playsinline></video>
    <div class="modal-url" id="modalUrl"></div>
    <div class="modal-actions">
      <button class="btn-dl" onclick="downloadVideo()">💾 ダウンロード</button>
      <button class="btn-cl" onclick="copyVideoUrl()">📋 URLコピー</button>
      <button class="btn-tw" onclick="openSiteLink()">🔗 サイトリンクコピー</button>
      <button class="btn-close" onclick="closeModal()">✕ 閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SITE = 'https://douga-adult.com';
const FILES = {
  rank:   `${SITE}/data/rank.json`,
  new:    `${SITE}/data/new.json`,
  review: `${SITE}/data/review.json`,
};

let allItems = [], filtered = [], currentSort = 'rank', showVideoOnly = false, searchQ = '';
let currentItem = null;

async function loadSort(sort) {
  currentSort = sort;
  showVideoOnly = false;
  searchQ = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.sort-tab').forEach((t,i) => t.classList.toggle('active', ['rank','new','review'][i] === sort));
  document.getElementById('grid').innerHTML = '<div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>';
  try {
    const ts = Math.floor(Date.now() / 60000);
    const res = await fetch(`${FILES[sort]}?_=${ts}`);
    const data = await res.json();
    allItems = (data?.result?.items || []).filter(i => i.content_id);
  } catch(e) {
    allItems = [];
  }
  applyFilter();
}

function filterByVideo() {
  showVideoOnly = true;
  applyFilter();
}
function clearFilter() {
  showVideoOnly = false;
  searchQ = '';
  document.getElementById('searchInput').value = '';
  applyFilter();
}
function filterCards() {
  searchQ = document.getElementById('searchInput').value.toLowerCase();
  applyFilter();
}

function applyFilter() {
  filtered = allItems.filter(item => {
    if (showVideoOnly && !getSampleUrl(item)) return false;
    if (searchQ) {
      const t = (item.title || '').toLowerCase();
      const a = (item.iteminfo?.actress || []).map(a => a.name).join(' ').toLowerCase();
      if (!t.includes(searchQ) && !a.includes(searchQ)) return false;
    }
    return true;
  });
  const total = filtered.length, withVid = filtered.filter(i => getSampleUrl(i)).length;
  document.getElementById('stats').innerHTML = `${filtered.length}件表示 / 動画あり：<span>${withVid}件</span>`;
  renderGrid();
}

function getSampleUrl(item) {
  const mv = item.sampleMovieURL;
  if (!mv) return '';
  return mv.size_560_360 || mv.size_476_306 || mv.size_644_414 || mv.size_720_480 || '';
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (!filtered.length) { grid.innerHTML = '<div class="loading"><p style="color:#555">該当なし</p></div>'; return; }
  grid.innerHTML = filtered.slice(0, 200).map(item => {
    const img = item.imageURL?.list || item.imageURL?.small || '';
    const title = (item.title || '').slice(0, 50);
    const cid = item.content_id;
    const hasVid = !!getSampleUrl(item);
    return `
    <div class="card ${hasVid ? 'has-video' : ''}" data-cid="${cid}">
      ${img ? `<img src="${img}" loading="lazy" alt="">` : '<div style="height:90px;background:#111"></div>'}
      <div class="card-body">
        ${hasVid ? '<span class="badge-video">▶ 動画あり</span>' : ''}
        <div class="card-title">${esc(title)}</div>
        <div class="card-actions">
          ${hasVid ? `<button class="btn-small btn-vid" onclick="openModal('${cid}')">動画を開く</button>` : ''}
          <button class="btn-small btn-site" onclick="copySiteLink('${cid}')">サイトURL</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(cid) {
  const item = allItems.find(i => i.content_id === cid);
  if (!item) return;
  currentItem = item;
  const url = getSampleUrl(item);
  document.getElementById('modalTitle').textContent = item.title || '';
  document.getElementById('modalVideo').src = url;
  document.getElementById('modalUrl').textContent = url;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalVideo').src = '';
  currentItem = null;
}

function downloadVideo() {
  if (!currentItem) return;
  const url = getSampleUrl(currentItem);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank';
  a.click();
  toast('新しいタブで開きました。長押し → 保存でDL');
}

function copyVideoUrl() {
  if (!currentItem) return;
  navigator.clipboard.writeText(getSampleUrl(currentItem)).then(() => toast('動画URLをコピーしました'));
}

function openSiteLink() {
  if (!currentItem) return;
  const url = `${SITE}/product.html?cid=${currentItem.content_id}`;
  navigator.clipboard.writeText(url).then(() => toast('サイトURLをコピーしました'));
}

function copySiteLink(cid) {
  const url = `${SITE}/product.html?cid=${cid}`;
  navigator.clipboard.writeText(url).then(() => toast('URLをコピーしました'));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSort('rank');
</script>
</body>
</html>
